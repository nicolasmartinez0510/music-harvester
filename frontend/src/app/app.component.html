<div
  class="layout"
  [class.sidebar-open]="sidebarOpen"
  [class.sidebar-collapsed]="sidebarCollapsed"
>
  <aside class="sidebar" aria-label="Navegación principal">
    <div class="sidebar-top">
      <a routerLink="/downloads" class="brand" (click)="closeSidebar()" title="Music Harvester">
        <img src="logo.png?v=4" alt="" class="brand-logo" width="36" height="36" />
        <span class="brand-text">Music Harvester</span>
      </a>
      <button
        type="button"
        class="btn-icon sidebar-close"
        (click)="closeSidebar()"
        aria-label="Cerrar menú"
        title="Cerrar menú"
      >
        <app-icon name="x" />
      </button>
    </div>

    <nav class="nav">
      <a
        routerLink="/downloads"
        routerLinkActive="active"
        class="nav-item"
        title="Descargas"
        (click)="closeSidebar()"
      >
        <app-icon name="download" [size]="18" />
        <span>Descargas</span>
      </a>
      <a
        routerLink="/browse"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
        title="Explorar"
        (click)="closeSidebar()"
      >
        <app-icon name="compass" [size]="18" />
        <span>Explorar</span>
      </a>

      <div class="nav-section" [class.nav-section-collapsed]="!favoritesExpanded">
        <button
          type="button"
          class="nav-section-toggle"
          (click)="toggleFavoritesExpanded()"
          [attr.aria-expanded]="favoritesExpanded"
          [attr.aria-label]="favoritesExpanded ? 'Colapsar favoritos' : 'Expandir favoritos'"
          title="Favoritos"
        >
          <span class="nav-section-title">Favoritos</span>
          <span class="nav-section-chevron" aria-hidden="true">
            <app-icon name="chevron-down" [size]="14" />
          </span>
        </button>
        <div class="nav-section-body" [attr.aria-hidden]="!favoritesExpanded">
          <div class="nav-section-body-inner">
            @if (favorites.favorites().length === 0) {
              <p class="nav-empty">Sin favoritos</p>
            } @else {
              @for (fav of favorites.favorites(); track fav.provider + fav.id) {
                <a
                  [routerLink]="['/browse', fav.provider, 'artists', fav.id]"
                  [queryParams]="{ from: 'favorites' }"
                  routerLinkActive="active"
                  class="nav-item nav-favorite"
                  [title]="fav.name"
                  [attr.tabindex]="favoritesExpanded ? null : -1"
                  (click)="closeSidebar()"
                >
                  @if (fav.cover_url) {
                    <img [src]="fav.cover_url" [alt]="" class="nav-fav-cover" width="18" height="18" />
                  } @else {
                    <app-icon name="star-filled" [size]="16" />
                  }
                  <span>{{ fav.name }}</span>
                </a>
              }
            }
          </div>
        </div>
      </div>

      <a
        routerLink="/playlists"
        routerLinkActive="active"
        class="nav-item"
        title="Playlists"
        (click)="closeSidebar()"
      >
        <app-icon name="list" [size]="18" />
        <span>Playlists</span>
      </a>
      <a
        routerLink="/settings"
        routerLinkActive="active"
        class="nav-item"
        title="Configuración"
        (click)="closeSidebar()"
      >
        <app-icon name="gear" [size]="18" />
        <span>Configuración</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [attr.title]="theme.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro'"
      >
        <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
        <span>{{ theme.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}</span>
      </button>
    </div>
  </aside>

  <button
    type="button"
    class="sidebar-collapse"
    (click)="toggleSidebarCollapsed()"
    [attr.aria-label]="sidebarCollapsed ? 'Expandir menú' : 'Colapsar menú'"
    [attr.title]="sidebarCollapsed ? 'Expandir menú' : 'Colapsar menú'"
    [attr.aria-expanded]="!sidebarCollapsed"
  >
    <app-icon [name]="sidebarCollapsed ? 'chevrons-right' : 'chevrons-left'" [size]="14" />
  </button>

  @if (sidebarOpen) {
    <div class="sidebar-backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <div class="shell">
    <header class="mobile-bar">
      <button
        type="button"
        class="btn-icon"
        (click)="openSidebar()"
        aria-label="Abrir menú"
        title="Abrir menú"
      >
        <app-icon name="menu" />
      </button>
      <a routerLink="/downloads" class="mobile-brand">
        <img src="logo.png?v=4" alt="" width="28" height="28" />
        <span>Music Harvester</span>
      </a>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>

<app-toast-host />
