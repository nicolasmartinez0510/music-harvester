<section class="page">
  <header class="page-header">
    <h1>Nueva descarga</h1>
    <p>Pegá una URL de YouTube Music o Deezer (track, álbum o playlist).</p>
  </header>

  <form class="card form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>URL</span>
      <input
        type="url"
        formControlName="url"
        placeholder="https://music.youtube.com/watch?v=..."
        autocomplete="off"
      />
      @if (form.controls.url.touched && form.controls.url.hasError('required')) {
        <small class="field-error">La URL es obligatoria.</small>
      }
    </label>

    <div class="provider-row">
      <div class="provider-badge" [class.known]="!!detectedProvider">
        Detectado: {{ detectedLabel() }}
      </div>
      <label class="field provider-select">
        <span>Proveedor</span>
        <select formControlName="provider">
          <option value="auto">Auto</option>
          <option value="youtube_music">YouTube Music</option>
          <option value="deezer">Deezer</option>
        </select>
      </label>
    </div>

    <label class="field">
      <span>Formato</span>
      <select formControlName="format">
        @for (format of availableFormats(); track format.value) {
          <option [value]="format.value">{{ format.label }}</option>
        }
      </select>
      @if (form.controls.provider.value === 'deezer' || detectedProvider === 'deezer') {
        <small class="field-hint">FLAC requiere cuenta Deezer HiFi y ARL en Settings.</small>
      }
    </label>

    @if (errorMessage) {
      <p class="alert alert-error" role="alert">{{ errorMessage }}</p>
    }

    <div class="actions">
      <button type="submit" class="btn btn-primary" [disabled]="submitting">
        {{ submitting ? 'Encolando…' : 'Descargar' }}
      </button>
      <a routerLink="/downloads" class="btn btn-secondary">Ver cola</a>
    </div>
  </form>
</section>
