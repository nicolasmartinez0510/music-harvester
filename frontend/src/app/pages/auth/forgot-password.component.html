<section>
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <img src="logo.png?v=4" alt="" class="auth-logo" width="54" height="54" />
    <h1>Recuperar contraseña</h1>
    @if (sent) {
      <p class="auth-subtitle">Si el correo está registrado, enviamos un enlace. Vence en 15 minutos.</p>
    } @else {
      <p class="auth-subtitle">Te mandamos un enlace al correo de la cuenta.</p>
      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" />
      </label>
      <button type="submit" class="btn btn-primary auth-submit" [disabled]="saving">Enviar enlace</button>
    }
    <p class="auth-switch"><a routerLink="/login">Volver a iniciar sesión</a></p>
  </form>
</section>
