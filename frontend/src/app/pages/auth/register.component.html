<section>
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <img src="logo.png?v=4" alt="" class="auth-logo" width="54" height="54" />
    <h1>Crear cuenta</h1>
    <p class="auth-subtitle">
      {{
        auth.emailVerificationEnabled()
          ? 'Te vamos a pedir un código de 4 dígitos por mail.'
          : 'Creá tu cuenta para entrar.'
      }}
    </p>

    <label class="field">
      <span>Nombre</span>
      <input type="text" formControlName="first_name" />
    </label>
    <label class="field">
      <span>Apellido</span>
      <input type="text" formControlName="last_name" />
    </label>
    <label class="field">
      <span>Usuario</span>
      <input type="text" formControlName="username" autocomplete="username" />
      <small class="field-hint">Minúsculas, números, guiones. Mínimo 3 caracteres.</small>
    </label>
    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label class="field">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>
    <label class="field">
      <span>Confirmar contraseña</span>
      <input
        type="password"
        formControlName="password_confirmation"
        autocomplete="new-password"
        [class.invalid]="form.hasError('passwordMismatch')"
      />
      @if (form.hasError('passwordMismatch')) {
        <small class="field-error">Las contraseñas no coinciden.</small>
      }
    </label>

    <div class="field">
      <span>Avatar</span>
      <div class="avatar-grid">
        @for (id of avatars; track id) {
          <button
            type="button"
            class="avatar-option"
            [class.selected]="form.controls.avatar_id.value === id"
            (click)="form.controls.avatar_id.setValue(id)"
          >
            <img [src]="'avatars/' + id + '.svg'" [alt]="id" />
          </button>
        }
      </div>
    </div>

    @if (errorMessage) {
      <p class="alert alert-error" role="alert">{{ errorMessage }}</p>
    }

    <button type="submit" class="btn btn-primary auth-submit" [disabled]="saving">
      {{ saving ? 'Creando…' : 'Registrarme' }}
    </button>
    <p class="auth-switch">¿Ya tenés cuenta? <a routerLink="/login">Entrá</a></p>
  </form>
</section>
