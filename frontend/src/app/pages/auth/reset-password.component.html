<section>
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <img src="logo.png?v=4" alt="" class="auth-logo" width="54" height="54" />
    <h1>Nueva contraseña</h1>
    @if (checking) {
      <p class="auth-subtitle">Validando el código…</p>
    } @else if (!invalid) {
      <p class="auth-subtitle">Elegí una contraseña nueva para tu cuenta.</p>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      <label class="field">
        <span>Confirmar contraseña</span>
        <input
          type="password"
          formControlName="password_confirmation"
          autocomplete="new-password"
          [class.invalid]="form.hasError('passwordMismatch')"
        />
        @if (form.hasError('passwordMismatch')) {
          <small class="field-error">Las contraseñas no coinciden.</small>
        }
      </label>
      @if (errorMessage) {
        <p class="alert alert-error" role="alert">{{ errorMessage }}</p>
      }
      <button type="submit" class="btn btn-primary auth-submit" [disabled]="saving">Guardar</button>
    }
    <p class="auth-switch"><a routerLink="/login">Volver a iniciar sesión</a></p>
  </form>
</section>
