<section>
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <img src="logo.png?v=4" alt="" class="auth-logo" width="54" height="54" />
    <h1>Iniciar sesión</h1>
    <p class="auth-subtitle">Bienvenido</p>

    @if (registered) {
      <p class="alert alert-success" role="status">Cuenta creada. Ya podés entrar.</p>
    }

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label class="field">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (auth.emailVerificationEnabled()) {
      <a class="auth-forgot" routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
    }

    @if (errorMessage) {
      <p class="alert alert-error" role="alert">{{ errorMessage }}</p>
    }

    <button type="submit" class="btn btn-primary auth-submit" [disabled]="saving">
      {{ saving ? 'Entrando…' : 'Entrar' }}
    </button>

    <p class="auth-switch">¿No tenés cuenta? <a routerLink="/register">Registrate</a></p>
  </form>
</section>
