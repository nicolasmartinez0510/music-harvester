# Production-safe defaults: app code (vendor, frontend) lives in the image.
# Local dev: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Synology:  docker compose -f docker-compose.yml -f docker-compose.synology.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-music_harvester}
      POSTGRES_USER: ${DB_USERNAME:-music}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-music}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-music} -d ${DB_DATABASE:-music_harvester}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      target: app
    image: music-harvester-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - music_data:/music
      - ./cookies:/cookies:ro
      - app_storage:/var/www/html/storage
    environment: &app_env
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-music_harvester}
      DB_USERNAME: ${DB_USERNAME:-music}
      DB_PASSWORD: ${DB_PASSWORD:-music}
      QUEUE_CONNECTION: database
      MUSIC_PATH: /music
      COOKIES_PATH: /cookies/cookies.txt
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Becomes healthy once the migrations table exists (app entrypoint migrated).
      test: ["CMD", "php", "artisan", "migrate:status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  worker:
    image: music-harvester-app
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=3600
    env_file:
      - .env
    volumes:
      - music_data:/music
      - ./cookies:/cookies:ro
      - app_storage:/var/www/html/storage
    environment: *app_env
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy

  scheduler:
    image: music-harvester-app
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    environment: *app_env
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      target: nginx
    image: music-harvester-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  music_data:
  pg_data:
  app_storage:
