# Synology NAS: bind-mount only the music library + cookies.
# Postgres data and Laravel storage stay on NAMED volumes (pg_data, app_storage)
# from the base compose so the container's www-data user can write storage
# (bind-mounted host folders on Synology are owned by the DSM user, not uid 33,
# and chown often fails on them -> log permission errors).
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.synology.yml up -d --build
#
# Do NOT use docker-compose.dev.yml on the NAS.
#
# Host library path is configurable via MUSIC_HOST_PATH in .env
# (e.g. /volume1/music, /volume2/music, /volume3/music).
# Inside the container the path MUST stay /music (MUSIC_PATH + Settings).

services:
  app:
    volumes: !override
      - ${MUSIC_HOST_PATH:-/volume1/music}:/music
      - ./cookies:/cookies:ro
      - app_storage:/var/www/html/storage

  worker:
    volumes: !override
      - ${MUSIC_HOST_PATH:-/volume1/music}:/music
      - ./cookies:/cookies:ro
      - app_storage:/var/www/html/storage

  scheduler:
    volumes: !override
      - app_storage:/var/www/html/storage
