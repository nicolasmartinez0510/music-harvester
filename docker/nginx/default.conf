server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Docker embedded DNS — re-resolve service names so recreating `app`
    # does not leave nginx stuck on a stale upstream IP (502 Bad Gateway).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    location /api {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /up {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        root /var/www/html/frontend/dist/frontend/browser;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
